<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASHU TV</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HLS.js for Live TV Streams (.m3u8) & Quality selection -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Phosphor Icons for UI Buttons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            font-family: sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Video Player Fullscreen Setup */
        #video-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
            background-color: #000;
            overflow: hidden;
        }
        #video-container:fullscreen,
        #video-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
        }
        @media (orientation: landscape) {
            #video-container { inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
            #video-player { width: 100%; height: 100%; object-fit: contain; }
        }
        
        video { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Zero black bars */
            border: none; 
            outline: none;
        }

        /* Hide Scrollbars */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* UI Layers */
        .ui-layer {
            position: fixed; 
            inset: 0; 
            z-index: 10;
            display: flex;
            transition: opacity 0.3s ease;
        }
        
        .ui-hidden { opacity: 0; pointer-events: none; }
        .ui-visible { opacity: 1; pointer-events: auto; }

        /* Ribbons (Glassmorphism Dark Theme) */
        .ribbon {
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; 
            flex-direction: column;
        }
        
        #ribbon-cat { width: 260px; }
        #ribbon-chan { width: 340px; background: rgba(15, 23, 42, 0.95); }

        /* Bottom Player Controls (Glassmorphism) */
        #controls-bar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 12px 24px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* Quality Selection Menu */
        #quality-menu {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 160px;
            max-height: 50vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* Persistent top-left menu button */
        #always-menu-btn {
            position: fixed; top: 14px; left: 14px; z-index: 80;
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; border-radius: 14px;
            color: #fff; background: rgba(15,23,42,.92);
            border: 2px solid rgba(255,215,0,.8);
            box-shadow: 0 4px 18px rgba(0,0,0,.45); font-weight: 700;
            cursor: pointer; font-size: 16px;
        }
        #always-menu-btn:focus, #always-menu-btn.tv-focus { outline: 3px solid #FFD700; }
        #volume-indicator {
            position: fixed; right: 18px; top: 18px; z-index: 75;
            background: rgba(15,23,42,.92); border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px; padding: 9px 14px; color: white; font-weight: 700;
            opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        #volume-indicator.show { opacity: 1; }

        /* Smart TV Focus Highlights */
        .tv-item {
            border: 4px solid transparent;
            transition: all 0.2s;
            border-radius: 12px;
        }
        
        /* Bright focus for D-Pad navigation */
        .tv-focus {
            border-color: #FFD700 !important;
            background-color: rgba(71, 85, 105, 0.9) !important;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transform: scale(1.06);
            color: #fff !important;
            z-index: 20;
        }

        .cat-active-dim {
            background-color: rgba(51, 65, 85, 0.7);
            border-left: 4px solid #FFD700;
            color: #FFD700;
        }

        /* Control Buttons styling */
        .control-btn {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 24px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1); 
            border-left-color: #FFD700;
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #user-logo { position:fixed; top:16px; right:16px; z-index:80; width:78px; height:78px; border-radius:50%; overflow:hidden; border:3px solid #FFD700; background:#1e293b; box-shadow:0 2px 18px #0009; display:flex; align-items:center; justify-content:center; text-decoration:none; }
        #user-logo img { width:100%; height:100%; object-fit:cover; object-position:center 28%; }
        #user-logo-fallback { display:none; width:100%; height:100%; align-items:center; justify-content:center; color:#FFD700; font-weight:800; font-size:18px; }
        @media(max-width:600px) { #user-logo { width:62px; height:62px; top:10px; right:10px; } }
        #always-menu-btn { position:fixed; top:18px; left:18px; z-index:90; display:flex; align-items:center; gap:8px; padding:10px 15px; border:2px solid #FFD700; border-radius:14px; background:rgba(15,23,42,.88); color:white; font-weight:700; box-shadow:0 2px 18px #0009; }
        #always-menu-btn i { font-size:22px; }
        #volume-indicator { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:80; opacity:0; pointer-events:none; padding:10px 16px; border-radius:12px; background:#0f172ae8; border:1px solid #FFD700; color:white; transition:opacity .2s; }
        #volume-indicator.show { opacity:1; }

        /* Mobile-first touch layout */
        html, body { width:100%; height:100%; height:100dvh; touch-action: manipulation; }
        button, .tv-item, .control-btn, #quality-menu > div { cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; }
        #video-player { object-fit:contain; background:#000; }
        /* Immersive fullscreen player on phones */
        body.player-fullscreen,
        body.player-fullscreen #video-container,
        #video-container:fullscreen,
        #video-container:-webkit-full-screen {
            width:100vw !important; height:100vh !important; height:100dvh !important;
            inset:0 !important; margin:0 !important; padding:0 !important;
            background:#000 !important; overflow:hidden !important;
        }
        body.player-fullscreen #video-player,
        #video-container:fullscreen #video-player,
        #video-container:-webkit-full-screen #video-player {
            width:100% !important; height:100% !important; object-fit:contain !important;
        }
        #controls-bar { z-index:30; }
        #ctrl-fullscreen { background:rgba(255,255,255,.16); }
        body.player-fullscreen #controls-bar {
            bottom:max(12px, env(safe-area-inset-bottom));
        }
        #menu-layer { align-items:stretch; }
        #ribbon-cat { width:min(42vw, 190px); min-width:125px; }
        #ribbon-chan { width:min(58vw, 330px); min-width:0; }
        #controls-bar { bottom:max(18px, env(safe-area-inset-bottom)); gap:clamp(8px,2.5vw,16px); padding:10px 14px; max-width:calc(100vw - 24px); }
        .control-btn { width:clamp(42px,12vw,50px); height:clamp(42px,12vw,50px); flex:0 0 auto; }
        #always-menu-btn { top:max(10px,env(safe-area-inset-top)); left:10px; padding:9px 12px; font-size:14px; }
        #always-menu-btn { top:50%; left:8px; transform:translateY(-50%); width:44px; height:58px; padding:0; justify-content:center; border-radius:12px; font-size:28px; background:rgba(10,15,25,.92); }
        #always-menu-btn i { font-size:28px; }
        #player-options-menu { position:fixed; top:50%; left:60px; transform:translateY(-50%); z-index:95; display:none; min-width:205px; max-width:calc(100vw - 76px); padding:8px; gap:5px; flex-direction:column; border:1px solid rgba(255,215,0,.65); border-radius:14px; background:rgba(10,15,25,.97); box-shadow:0 8px 35px #000b; }
        #player-options-menu.open { display:flex; }
        #player-options-menu button { display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 12px; border:0; border-radius:9px; background:rgba(255,255,255,.07); color:white; text-align:left; font-size:15px; font-weight:600; }
        #player-options-menu button:active { background:rgba(255,215,0,.24); }
        #player-options-menu i { font-size:22px; color:#FFD700; }
        #quality-menu { left:60px !important; right:12px; bottom:auto !important; top:50% !important; transform:translateY(-50%) !important; max-height:75dvh !important; overflow-y:auto; }
        .qual-item.unavailable { opacity:.38; cursor:not-allowed; }
        .qual-item .quality-note { display:block; font-size:11px; color:#cbd5e1; font-weight:400; }
        body.player-fullscreen #always-menu-btn { z-index:120; }
        body.player-fullscreen #player-options-menu { z-index:121; }
        /* Keep all interactive UI above video when the whole document is fullscreen in Android Chrome */
        html:fullscreen, html:-webkit-full-screen { width:100% !important; height:100% !important; background:#000 !important; }
        body.player-fullscreen #video-container { position:fixed !important; inset:0 !important; width:100vw !important; height:100vh !important; height:100dvh !important; z-index:1 !important; }
        body.player-fullscreen #always-menu-btn { position:fixed !important; top:max(18px, env(safe-area-inset-top)) !important; left:max(18px, env(safe-area-inset-left)) !important; transform:none !important; z-index:2147483000 !important; display:flex !important; visibility:visible !important; opacity:1 !important; pointer-events:auto !important; }
        body.player-fullscreen #player-options-menu { z-index:2147483001 !important; }
        body.player-fullscreen #volume-indicator { z-index:2147483002 !important; }
        body.player-fullscreen #controls-layer, body.player-fullscreen #menu-layer { z-index:2147482000 !important; }
        #video-container, #video-player { touch-action:none; }
        #user-logo { width:48px; height:48px; top:max(10px,env(safe-area-inset-top)); right:10px; }
        #volume-indicator { bottom:max(85px,calc(env(safe-area-inset-bottom) + 75px)); }
        #quality-menu { bottom:max(90px,calc(env(safe-area-inset-bottom) + 82px)); max-width:calc(100vw - 30px); }
        .cat-item, .chan-item, .qual-item { min-height:54px; }
        @media (min-width:700px) { #ribbon-cat {width:230px} #ribbon-chan {width:320px} }

        /* Fix: compact volume toast, never a giant overlay */
        #volume-indicator {
            display:inline-flex !important;
            width:max-content !important;
            max-width:calc(100vw - 32px) !important;
            min-width:0 !important;
            height:auto !important;
            min-height:0 !important;
            max-height:none !important;
            box-sizing:border-box !important;
            position:fixed !important;
            left:50% !important;
            right:auto !important;
            top:auto !important;
            bottom:max(22px, env(safe-area-inset-bottom)) !important;
            transform:translateX(-50%) !important;
            padding:9px 14px !important;
            margin:0 !important;
            white-space:nowrap !important;
            overflow:visible !important;
            font-size:15px !important;
            line-height:1.25 !important;
            border-radius:10px !important;
            background:rgba(15,23,42,.94) !important;
            color:#fff !important;
            opacity:0 !important;
            pointer-events:none !important;
            z-index:2147483646 !important;
        }
        #volume-indicator.show { opacity:1 !important; }
        /* Keep the persistent menu above the video in both portrait and landscape */
        #always-menu-btn { position:fixed !important; z-index:2147483647 !important; }
        #player-options-menu { position:fixed !important; z-index:2147483647 !important; }
        #video-container:fullscreen #always-menu-btn,
        #video-container:-webkit-full-screen #always-menu-btn,
        body.player-fullscreen #always-menu-btn { z-index:2147483647 !important; }

        /* GOOGLE TV / 10-foot UI */
        html, body { width:100%; height:100%; overflow:hidden; background:#000; }
        body { cursor:default; }
        #video-container { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; }
        #video-player { object-fit:contain; }
        #always-menu-btn {
            position:fixed !important; left:34px !important; top:24px !important;
            transform:none !important; width:64px !important; height:76px !important;
            display:flex !important; align-items:center !important; justify-content:center !important;
            z-index:2147483647 !important; border:3px solid #FFD700 !important;
            border-radius:18px !important; background:rgba(8,14,28,.94) !important;
            color:#fff !important; font-size:38px !important; padding:0 !important;
            outline-offset:5px;
        }
        #always-menu-btn i { font-size:36px !important; }
        #player-options-menu {
            position:fixed !important; top:112px !important; left:34px !important;
            transform:none !important; z-index:2147483646 !important;
            min-width:310px !important; max-width:520px !important; padding:14px !important;
            border:2px solid #FFD700 !important; border-radius:20px !important;
            background:rgba(8,14,28,.98) !important; box-shadow:0 12px 60px #000d !important;
        }
        #player-options-menu button {
            min-height:66px !important; padding:14px 18px !important;
            font-size:23px !important; border-radius:12px !important;
        }
        #player-options-menu button.tv-focus,
        #player-options-menu button:focus {
            outline:4px solid #FFD700 !important; background:#29364b !important;
            transform:scale(1.025);
        }
        #player-options-menu i { font-size:28px !important; }
        #menu-layer .ribbon { width:min(520px,42vw) !important; max-width:520px !important; }
        #menu-layer h2, #menu-layer h3 { font-size:32px !important; }
        .cat-item, .chan-item { min-height:66px; font-size:22px !important; padding:18px 22px !important; }
        .cat-item span, .chan-item span { font-size:22px !important; }
        #controls-bar { bottom:42px !important; gap:18px !important; }
        #controls-bar .control-btn { width:74px !important; height:74px !important; font-size:32px !important; }
        #controls-bar .control-btn i { font-size:34px !important; }
        #quality-menu { left:50% !important; right:auto !important; top:50% !important; bottom:auto !important;
            transform:translate(-50%,-50%) !important; width:min(600px,70vw) !important;
            max-height:78vh !important; padding:18px !important; border-radius:18px !important; }
        #quality-menu .qual-item { min-height:58px !important; font-size:21px !important; padding:14px 20px !important; }
        .tv-focus { outline:4px solid #FFD700 !important; outline-offset:2px; background-color:rgba(45,58,78,.98) !important; }
        #toast { top:28px !important; right:32px !important; max-width:48vw; }
        #toast-msg { font-size:22px !important; }
        #volume-indicator { top:28px !important; right:32px !important; left:auto !important; bottom:auto !important; font-size:22px !important; }
        #user-logo { width:72px !important; height:72px !important; }
        @media (max-width:900px) {
            #always-menu-btn { left:12px !important; }
            #player-options-menu { left:12px !important; top:96px !important; max-width:calc(100vw - 24px) !important; }
        }
        @media (min-width:1200px) {
            #menu-layer .ribbon { width: min(560px, 38vw) !important; }
        }

    </style>
</head>
<body>

    <!-- VIDEO PLAYER -->
    <div id="video-container">
        <video id="video-player" playsinline webkit-playsinline></video>
    </div>

    <!-- SPLASH SCREEN -->
    <div id="splash" class="fixed inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <h1 class="text-6xl font-bold text-white mb-6">ASHU<span class="text-yellow-400"> TV</span></h1>
        <div class="spinner"></div>
        <p class="mt-6 text-slate-300 text-xl font-medium tracking-wide">लाइव टीवी चैनल लोड हो रहे हैं...</p>
    </div>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const CAT_ORDER = ['Kids', 'Education', 'News', 'Bhakti', 'Cinema', 'Entertainment', 'Music', 'Sports', 'Others'];
        const CAT_MAP = {
            'kids': 'Kids', 'children': 'Kids', 'animation': 'Kids',
            'education': 'Education', 'educational': 'Education', 'e-vidya': 'Education', 'evidya': 'Education',
            'news': 'News',
            'religious': 'Bhakti', 'religion': 'Bhakti', 'devotional': 'Bhakti', 'spiritual': 'Bhakti',
            'movies': 'Cinema', 'cinema': 'Cinema', 'film': 'Cinema',
            'entertainment': 'Entertainment', 'general': 'Entertainment', 'comedy': 'Entertainment', 'lifestyle': 'Entertainment',
            'music': 'Music',
            'sports': 'Sports'
        };

        // Possible States: 'HIDDEN', 'CATEGORY', 'CHANNEL', 'CONTROLS', 'QUALITY'
        let uiState = 'HIDDEN'; 
        
        let catIndex = 0;
        let chanIndex = 0;
        let controlIndex = 0;
        let qualityIndex = 0;
        let playerOptionIndex = 0;
        
        const controlsArray = ['ctrl-playpause', 'ctrl-mute', 'ctrl-voldown', 'ctrl-volup', 'ctrl-quality', 'ctrl-fullscreen'];
        let hlsQualityLevels = [{ name: 'Auto', level: -1 }]; // Default populated by HLS

        let groupedChannels = {};
        let orderedCategoryKeys = [];
        let activeCategory = '';
        let currentChannel = null;

        const videoPlayer = document.getElementById('video-player');
        let hlsInstance = null;
        let controlsTimeout = null;

        // --- 2. FETCH AND PARSE M3U ---
        async function fetchPlaylists() {
            try {
                const urls = [
                    'https://iptv-org.github.io/iptv/languages/hin.m3u',
                    'https://iptv-org.github.io/iptv/languages/bho.m3u',
                    'https://iptv-org.github.io/iptv/languages/mai.m3u'
                ];
                
                const responses = await Promise.all(urls.map(url => fetch(url).catch(e => null)));
                let fullText = "";
                
                for (let res of responses) {
                    if (res && res.ok) {
                        fullText += (await res.text()) + "\n";
                    }
                }
                
                parseM3U(fullText);
                
                // Hide splash screen
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
                
                initUI();
            } catch (err) {
                console.error("Failed to load playlists", err);
                document.querySelector('#splash p').innerText = "नेटवर्क एरर। कृपया ऐप को रीस्टार्ट करें।";
            }
        }

        function parseM3U(text) {
            const lines = text.split('\n');
            let tempChannels = [];
            let currentObj = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentObj = { id: 'ch_' + i };
                    
                    const logoMatch = line.match(/tvg-logo="(.*?)"/);
                    currentObj.logo = logoMatch ? logoMatch[1] : '';

                    const groupMatch = line.match(/group-title="(.*?)"/i);
                    let rawGroup = groupMatch ? groupMatch[1].toLowerCase() : 'others';
                    if (/e\s*-?vidya|evidya/i.test(line)) rawGroup = 'education';
                    
                    let mappedCat = 'Others';
                    for (const [key, val] of Object.entries(CAT_MAP)) {
                        if (rawGroup.includes(key)) { mappedCat = val; break; }
                    }
                    currentObj.category = mappedCat;

                    const splitComma = line.split(',');
                    currentObj.name = splitComma.length > 1 ? splitComma[1].trim() : 'Unknown';

                    // 1. Force 'Unique TV' to Entertainment Category
                    if (currentObj.name.toLowerCase().includes('unique tv')) {
                        currentObj.category = 'Entertainment';
                    }

                } else if (line.startsWith('http') && currentObj) {
                    currentObj.url = line;
                    tempChannels.push(currentObj);
                    currentObj = null;
                }
            }

            // Supplemental public streams for education and regional-language viewing.
            // E-Vidya public HTTP endpoints are known to go offline intermittently; these are retried like other HLS streams.
            const supplementalChannels = [
                {id:'supp_evidya8',name:'E-Vidya 8',category:'Education',logo:'',url:'http://103.72.101.252:8080/live/409.m3u8'},
                {id:'supp_evidya9',name:'E-Vidya 9',category:'Education',logo:'',url:'http://103.72.101.252:8080/live/410.m3u8'},
                {id:'supp_evidya10',name:'E-Vidya 10',category:'Education',logo:'',url:'http://103.72.101.252:8080/live/411.m3u8'},
                {id:'supp_evidya11',name:'E-Vidya 11',category:'Education',logo:'',url:'http://103.72.101.252:8080/live/1410.m3u8'},
                {id:'supp_evidya12',name:'E-Vidya 12',category:'Education',logo:'',url:'http://103.72.101.252:8080/live/1532.m3u8'},
                {id:'supp_bhojpuri_cinema_akamaized',name:'Bhojpuri Cinema (Backup)',category:'Cinema',logo:'',url:'https://live-bhojpuri.akamaized.net/liveabr/playlist.m3u8'},
                {id:'supp_epic_bhojpuri',name:'Epic Bhojpuri',category:'Cinema',logo:'',url:'https://mumt01.tangotv.in/O5aw8Zn3EPICBHOJPURI/index.m3u8'}
            ];
            tempChannels.push(...supplementalChannels);

            // Remove URL duplicates
            let uniqueChannels = [];
            let seen = new Set();
            tempChannels.forEach(c => {
                if (!seen.has(c.url)) { seen.add(c.url); uniqueChannels.push(c); }
            });

            // Category-wise curated ordering: only channels present in the playlist are promoted.
            // This is a preference order, not a live quality/rating measurement.
            const topCategoryOrder = {
                'News': ['aaj tak', 'abp news', 'ndtv india', 'india tv', 'zee news', 'news18 india', 'republic bharat'],
                'Bhakti': ['aastha', 'sanskar', 'sadhna', 'ishwar tv', 'divya'],
                'Cinema': ['star gold', 'zee cinema', 'sony max', 'colors cineplex', '&pictures', 'b4u movies', 'movies now', 'star gold 2'],
                'Entertainment': ['star plus', 'sony sab', 'zee tv', 'colors', 'sony entertainment', 'dangal', '&tv', 'unique tv'],
                'Music': ['9xm', 'mtv', 'zoom', 'b4u music', 'masti'],
                'Sports': ['star sports', 'sports18', 'sony sports', 'dd sports']
            };

            // Grouping logic & Initializing categories
            groupedChannels = {};
            CAT_ORDER.forEach(c => groupedChannels[c] = []);

            // 2. Exact Top Kids Channels Ordering
            const topKidsOrder = [
                'discovery kids',
                'wow kids',
                'the jungle book',
                'green gold tv',
                'epic kids digital',
                'disney junior',
                'kartoon network'
            ];
            
            let topKidsGroups = Array(topKidsOrder.length).fill(null).map(() => []);
            let otherKids = [];
            
            uniqueChannels.forEach(c => {
                let nameLow = c.name.toLowerCase();
                
                // Identify if channel is for Kids
                if (c.category === 'Kids' || nameLow.includes('kids') || nameLow.includes('cartoon') || nameLow.includes('animation')) {
                    c.category = 'Kids';
                    
                    // Check if it belongs to the top priority list
                    let foundIdx = topKidsOrder.findIndex(keyword => nameLow.includes(keyword));
                    
                    if (foundIdx !== -1) {
                        topKidsGroups[foundIdx].push(c);
                    } else {
                        otherKids.push(c);
                    }
                } else {
                    if (!groupedChannels[c.category]) groupedChannels[c.category] = [];
                    groupedChannels[c.category].push(c);
                }
            });

            // Combine the strictly ordered kids channels at the top, followed by the rest
            groupedChannels['Kids'] = [...topKidsGroups.flat(), ...otherKids];

            Object.entries(topCategoryOrder).forEach(([category, priorities]) => {
                if (!groupedChannels[category]) return;
                const rank = (channel) => {
                    const name = channel.name.toLowerCase();
                    const index = priorities.findIndex(keyword => name.includes(keyword));
                    return index < 0 ? priorities.length : index;
                };
                groupedChannels[category].sort((a, b) => rank(a) - rank(b));
            });

            orderedCategoryKeys = [];
            CAT_ORDER.forEach(c => { 
                if (groupedChannels[c] && groupedChannels[c].length > 0) {
                    orderedCategoryKeys.push(c);
                }
            });

            Object.keys(groupedChannels).forEach(c => {
                if (!orderedCategoryKeys.includes(c) && groupedChannels[c].length > 0) {
                    orderedCategoryKeys.push(c);
                }
            });

            activeCategory = orderedCategoryKeys.length > 0 ? orderedCategoryKeys[0] : '';
        }

        // --- 3. UI RENDERING ---
        function initUI() {
            renderCategories();
            
            // Start the first channel from the loaded playlist automatically.
            const allChannels = orderedCategoryKeys.flatMap(cat => groupedChannels[cat] || []);
            const startupChannel = allChannels[0];
            if (startupChannel) playChannel(startupChannel);
        }

        function renderCategories() {
            const list = document.getElementById('cat-list');
            list.innerHTML = '';
            
            orderedCategoryKeys.forEach((cat) => {
                const div = document.createElement('div');
                div.className = `tv-item cat-item flex items-center justify-between p-4 bg-slate-800/40 text-slate-300`;
                div.innerHTML = `
                    <span class="text-xl font-semibold">${cat}</span>
                    <span class="bg-black/50 text-sm px-3 py-1 rounded-md">${groupedChannels[cat].length}</span>
                `;
                div.addEventListener('click', () => {
                    catIndex = orderedCategoryKeys.indexOf(cat);
                    activeCategory = cat;
                    chanIndex = 0;
                    if (currentChannel && currentChannel.category === cat) {
                        const found = groupedChannels[cat].findIndex(c => c.id === currentChannel.id);
                        if (found >= 0) chanIndex = found;
                    }
                    renderChannels();
                    changeUIState('CHANNEL');
                });
                list.appendChild(div);
            });
        }

        function renderChannels() {
            const list = document.getElementById('chan-list');
            list.innerHTML = '';
            
            document.getElementById('chan-title').innerText = activeCategory;
            const channels = groupedChannels[activeCategory];
            document.getElementById('chan-count').innerText = `${channels.length} Channels`;

            channels.forEach((ch, idx) => {
                const div = document.createElement('div');
                let logoSrc = ch.logo || `https://placehold.co/100x60/1e293b/ffffff?text=TV`;
                const isPlaying = (currentChannel && currentChannel.id === ch.id);
                
                div.className = `tv-item chan-item flex items-center gap-4 p-3 bg-slate-800/40 text-slate-200`;
                div.innerHTML = `
                    <div class="w-24 h-16 bg-black/60 rounded-lg flex items-center justify-center p-1 shrink-0 relative overflow-hidden">
                        <img src="${logoSrc}" class="max-w-full max-h-full object-contain" onerror="this.src='https://placehold.co/100x60/1e293b/ffffff?text=TV'">
                        ${isPlaying ? '<div class="absolute inset-0 bg-black/50 flex items-center justify-center backdrop-blur-sm"><i class="ph-fill ph-play text-yellow-400 text-2xl"></i></div>' : ''}
                    </div>
                    <div class="flex-1 truncate font-medium text-lg ${isPlaying ? 'text-yellow-400' : ''}">${ch.name}</div>
                `;
                div.addEventListener('click', () => {
                    chanIndex = idx;
                    playChannel(ch);
                    changeUIState('HIDDEN');
                });
                list.appendChild(div);
            });
        }

        function renderQualityMenu() {
            const menu = document.getElementById('quality-menu');
            menu.innerHTML = '';
            const standardHeights = [144, 240, 360, 480, 540, 720, 1080, 1440];
            const options = [{ name: 'Auto (नेटवर्क के अनुसार)', level: -1, height: null, available: true }];
            standardHeights.forEach(height => {
                const actual = hlsQualityLevels.find(q => q.level >= 0 && (
                    Number(String(q.name).match(/\\d+/)?.[0]) === height ||
                    (hlsInstance && hlsInstance.levels[q.level] && hlsInstance.levels[q.level].height === height)
                ));
                options.push(actual
                    ? { name: `${height}p`, level: actual.level, height, available: true }
                    : { name: `${height}p`, level: null, height, available: false });
            });
            options.forEach(q => {
                const div = document.createElement('button');
                div.type = 'button';
                div.className = `tv-item qual-item px-4 py-3 text-white font-medium text-left rounded-lg${q.available ? '' : ' unavailable'}`;
                div.style.width = '100%';
                div.style.border = '0';
                div.style.color = 'white';
                div.style.background = 'rgba(51,65,85,.72)';
                div.innerHTML = `<span>${q.name}</span>${q.available ? '' : '<span class="quality-note">इस चैनल पर उपलब्ध नहीं</span>'}`;
                div.setAttribute('role', 'menuitem');
                div.disabled = !q.available;
                div.addEventListener('click', () => {
                    if (!q.available) return;
                    if (hlsInstance) {
                        hlsInstance.currentLevel = q.level;
                        showToast('क्वालिटी सेट', q.name);
                    } else {
                        showToast('क्वालिटी', 'इस चैनल में मैनुअल क्वालिटी चयन उपलब्ध नहीं है');
                    }
                    document.getElementById('player-options-menu').classList.remove('open');
                    changeUIState('HIDDEN');
                });
                menu.appendChild(div);
            });
            const note = document.createElement('p');
            note.className = 'text-xs text-slate-300 px-2 pt-1';
            note.textContent = 'केवल वही क्वालिटी चलेगी जो चुने हुए चैनल की स्ट्रीम में उपलब्ध है।';
            menu.appendChild(note);
        }

        // --- 4. FOCUS MANAGEMENT (D-PAD) ---
        function updateFocus() {
            // Remove all focus first
            document.querySelectorAll('.tv-item').forEach(el => el.classList.remove('tv-focus'));
            document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('cat-active-dim'));

            if (uiState === 'CATEGORY') {
                const catItems = document.querySelectorAll('.cat-item');
                if (catItems[catIndex]) {
                    catItems[catIndex].classList.add('tv-focus');
                    catItems[catIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } 
            else if (uiState === 'CHANNEL') {
                const catItems = document.querySelectorAll('.cat-item');
                const catActiveIdx = orderedCategoryKeys.indexOf(activeCategory);
                if (catItems[catActiveIdx]) catItems[catActiveIdx].classList.add('cat-active-dim');

                const chanItems = document.querySelectorAll('.chan-item');
                if (chanItems[chanIndex]) {
                    chanItems[chanIndex].classList.add('tv-focus');
                    chanItems[chanIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            else if (uiState === 'CONTROLS') {
                const ctrlId = controlsArray[controlIndex];
                const ctrlItem = document.getElementById(ctrlId);
                if (ctrlItem) ctrlItem.classList.add('tv-focus');
                
                // Hide quality menu if moving around controls
                document.getElementById('quality-menu').style.display = 'none';
            }
            else if (uiState === 'QUALITY') {
                const ctrlItem = document.getElementById('ctrl-quality');
                if (ctrlItem) ctrlItem.classList.add('cat-active-dim'); // Dim the gear icon

                const qualItems = document.querySelectorAll('.qual-item');
                if (qualItems[qualityIndex]) {
                    qualItems[qualityIndex].classList.add('tv-focus');
                    qualItems[qualityIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-x-10');
            
            // Clear existing timeout
            if(window.toastTimer) clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.add('opacity-0', 'translate-x-10'), 4000);
        }

        function changeUIState(newState) {
            uiState = newState;
            
            const menuLayer = document.getElementById('menu-layer');
            const controlsLayer = document.getElementById('controls-layer');
            const qualityMenu = document.getElementById('quality-menu');

            // Reset visibility
            menuLayer.classList.replace('ui-visible', 'ui-hidden');
            controlsLayer.classList.replace('ui-visible', 'ui-hidden');
            qualityMenu.style.display = 'none';

            if (newState === 'CATEGORY' || newState === 'CHANNEL') {
                menuLayer.classList.replace('ui-hidden', 'ui-visible');
            } else if (newState === 'CONTROLS') {
                controlsLayer.classList.replace('ui-hidden', 'ui-visible');
                updateControlIcons();
            } else if (newState === 'QUALITY') {
                controlsLayer.classList.replace('ui-hidden', 'ui-visible');
                qualityMenu.style.display = 'flex';
                renderQualityMenu();
            }
            
            if(newState !== 'HIDDEN') updateFocus();
        }

        // --- Mobile fullscreen / landscape handling ---
        // Fullscreen the document, not only the video element, so fixed menu and controls remain visible in Chrome.
        const playerRoot = document.getElementById('video-container');
        const fullscreenTarget = document.documentElement;
        const isPlayerFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
        function syncFullscreenIcon() {
            const btn = document.getElementById('ctrl-fullscreen');
            if (!btn) return;
            btn.innerHTML = isPlayerFullscreen()
                ? '<i class="ph-bold ph-corners-in"></i>'
                : '<i class="ph-bold ph-corners-out"></i>';
            btn.setAttribute('aria-label', isPlayerFullscreen() ? 'मिनिमाइज' : 'फुल स्क्रीन');
            btn.title = isPlayerFullscreen() ? 'मिनिमाइज' : 'फुल स्क्रीन';
        }
        async function enterMobileFullscreen() {
            try {
                if (!isPlayerFullscreen()) {
                    const request = fullscreenTarget.requestFullscreen || fullscreenTarget.webkitRequestFullscreen;
                    if (request) await request.call(fullscreenTarget);
                    else showToast('फुल स्क्रीन', 'Chrome में फुल स्क्रीन की अनुमति उपलब्ध नहीं है');
                }
            } catch (e) {
                showToast('फुल स्क्रीन', 'Chrome में फुल स्क्रीन शुरू नहीं हो सका');
            }
            try {
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
            } catch (e) {
                // Orientation lock may be denied by browser/device settings. The page still fills the fullscreen viewport.
            }
            document.body.classList.toggle('player-fullscreen', isPlayerFullscreen());
            syncFullscreenIcon();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 250);
        }
        async function exitMobileFullscreen() {
            try {
                if (isPlayerFullscreen()) {
                    const exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exit) await exit.call(document);
                }
            } catch (e) {}
            try {
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            } catch (e) {}
            document.body.classList.remove('player-fullscreen');
            syncFullscreenIcon();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 250);
        }
        async function toggleMobileFullscreen() {
            if (isPlayerFullscreen()) await exitMobileFullscreen();
            else await enterMobileFullscreen();
        }
        function onFullscreenChange() {
            document.body.classList.toggle('player-fullscreen', isPlayerFullscreen());
            syncFullscreenIcon();
            if (!isPlayerFullscreen()) {
                try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
            } else {
                try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
            }
            setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
        }
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        playerRoot.addEventListener('dblclick', toggleMobileFullscreen);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
        });

        // --- 5. PLAYER AND HLS LOGIC ---
        function playChannel(channel) {
            if (!channel) return;
            currentChannel = channel;
            
            showToast(channel.category, channel.name);
            hlsQualityLevels = [{ name: 'Auto', level: -1 }]; // Reset Qualities

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({ maxMaxBufferLength: 30 });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(videoPlayer);
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (!data.fatal) return;
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        showToast('चैनल कनेक्शन', 'दोबारा कनेक्ट करने की कोशिश…');
                        try { hlsInstance.startLoad(); } catch (_) {}
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        try { hlsInstance.recoverMediaError(); } catch (_) { showToast('चैनल उपलब्ध नहीं', 'यह स्ट्रीम बंद हो सकती है। दूसरा चैनल चुनें।'); }
                    } else {
                        showToast('चैनल उपलब्ध नहीं', 'यह स्ट्रीम बंद हो सकती है। दूसरा चैनल चुनें।');
                        try { hlsInstance.destroy(); } catch (_) {}
                        hlsInstance = null;
                    }
                });
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
                    videoPlayer.play().catch(() => {
                        // Chrome may block autoplay with sound; muted autoplay is generally permitted.
                        videoPlayer.muted = true;
                        videoPlayer.play().then(() => {
                            showToast('ऑटो प्ले', 'आवाज़ चालू करने के लिए वीडियो पर टैप करें');
                            updateControlIcons();
                        }).catch(() => {
                            showToast('प्ले दबाएँ', 'Chrome ने ऑटो-प्ले रोका है');
                        });
                    });
                    updateControlIcons();
                    
                    // Extract Quality Levels from HLS
                    if (data.levels && data.levels.length > 0) {
                        data.levels.forEach((lvl, i) => {
                            // Extract height (e.g. 720) and format
                            let qName = lvl.height ? `${lvl.height}p` : `Level ${i}`;
                            if(lvl.height === 1440) qName = '1440p (2K)';
                            if(lvl.height === 2160) qName = '2160p (4K)';
                            hlsQualityLevels.push({ name: qName, level: i });
                        });
                    }
                });
                
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = channel.url;
                videoPlayer.play().catch(() => {
                    videoPlayer.muted = true;
                    videoPlayer.play().catch(() => showToast('प्ले दबाएँ', 'Chrome ने ऑटो-प्ले रोका है'));
                });
            }
        }

        function playNextChannel(direction) {
            if (!currentChannel) return;
            const channels = groupedChannels[currentChannel.category];
            if (!channels || channels.length === 0) return;
            
            let idx = channels.findIndex(c => c.id === currentChannel.id);
            if (idx === -1) idx = 0;
            
            let nextIdx = idx + direction;
            if (nextIdx < 0) nextIdx = channels.length - 1;
            if (nextIdx >= channels.length) nextIdx = 0;
            
            playChannel(channels[nextIdx]);
        }

        // --- 6. CONTROLS ACTIONS ---
        function updateControlIcons() {
            const playIcon = videoPlayer.paused ? 'ph-play' : 'ph-pause';
            document.getElementById('ctrl-playpause').innerHTML = `<i class="ph-fill ${playIcon}"></i>`;
            
            const muteIcon = videoPlayer.muted || videoPlayer.volume === 0 ? 'ph-speaker-slash' : 'ph-speaker-high';
            document.getElementById('ctrl-mute').innerHTML = `<i class="ph-fill ${muteIcon}"></i>`;
        }

        function executeControlAction() {
            const action = controlsArray[controlIndex];
            if (action === 'ctrl-playpause') {
                if (videoPlayer.paused) videoPlayer.play();
                else videoPlayer.pause();
                updateControlIcons();
                showToast("Player", videoPlayer.paused ? "Paused" : "Playing");
            } 
            else if (action === 'ctrl-mute') {
                videoPlayer.muted = !videoPlayer.muted;
                updateControlIcons();
                showToast("Audio", videoPlayer.muted ? "Muted" : "Unmuted");
            }
            else if (action === 'ctrl-voldown') {
                videoPlayer.muted = false;
                videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
                updateControlIcons();
                showToast("Volume", Math.round(videoPlayer.volume * 100) + "%");
            }
            else if (action === 'ctrl-volup') {
                videoPlayer.muted = false;
                videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
                updateControlIcons();
                showToast("Volume", Math.round(videoPlayer.volume * 100) + "%");
            }
            else if (action === 'ctrl-quality') {
                qualityIndex = 0;
                changeUIState('QUALITY');
                if (hlsQualityLevels.length === 1) showToast('क्वालिटी', 'इस चैनल में केवल Auto उपलब्ध है');
            }
            else if (action === 'ctrl-fullscreen') {
                toggleMobileFullscreen().then(() => {
                    showToast('Player', isPlayerFullscreen() ? 'फुल स्क्रीन' : 'मिनिमाइज');
                });
            }
        }

        // Volume controls work with browser video audio. System-wide TV volume is controlled by the TV itself.
        let volumeToastTimer = null;
        function setPlayerVolume(delta) {
            videoPlayer.muted = false;
            videoPlayer.volume = Math.max(0, Math.min(1, videoPlayer.volume + delta));
            updateControlIcons();
            const indicator = document.getElementById('volume-indicator');
            indicator.textContent = `Volume ${Math.round(videoPlayer.volume * 100)}%`;
            indicator.classList.add('show');
            clearTimeout(volumeToastTimer);
            volumeToastTimer = setTimeout(() => indicator.classList.remove('show'), 1600);
        }
        function togglePlayerMute() {
            videoPlayer.muted = !videoPlayer.muted;
            updateControlIcons();
            const indicator = document.getElementById('volume-indicator');
            indicator.textContent = videoPlayer.muted ? 'आवाज बंद (Muted)' : `Volume ${Math.round(videoPlayer.volume * 100)}%`;
            indicator.classList.add('show');
            clearTimeout(volumeToastTimer);
            volumeToastTimer = setTimeout(() => indicator.classList.remove('show'), 1800);
        }
        function openMenuFromButton() {
            if (uiState === 'CATEGORY' || uiState === 'CHANNEL') {
                changeUIState('HIDDEN');
                document.getElementById('chan-list').innerHTML = '';
                return;
            }
            if (currentChannel) {
                const idx = orderedCategoryKeys.indexOf(currentChannel.category);
                if (idx >= 0) catIndex = idx;
            }
            changeUIState('CATEGORY');
        }
        const optionsMenu = document.getElementById('player-options-menu');
        const playerOptionButtons = Array.from(optionsMenu.querySelectorAll('[data-player-option]'));
        function focusPlayerOption() {
            playerOptionButtons.forEach((b, i) => b.classList.toggle('tv-focus', i === playerOptionIndex));
            if (playerOptionButtons[playerOptionIndex]) playerOptionButtons[playerOptionIndex].focus({preventScroll:true});
        }
        function openPlayerOptions() {
            optionsMenu.classList.add('open');
            playerOptionIndex = 0;
            focusPlayerOption();
        }
        function closePlayerOptions() {
            optionsMenu.classList.remove('open');
            playerOptionButtons.forEach(b => b.classList.remove('tv-focus'));
        }
        function activatePlayerOption(option) {
            closePlayerOptions();
            if (option === 'channels') openMenuFromButton();
            else if (option === 'quality') {
                qualityIndex = 0;
                changeUIState('QUALITY');
            } else if (option === 'fullscreen') {
                toggleMobileFullscreen();
            } else if (option === 'playpause') {
                if (videoPlayer.paused) videoPlayer.play().catch(() => {});
                else videoPlayer.pause();
                updateControlIcons();
            }
            else if (option === 'exit') {
                try { videoPlayer.pause(); } catch (e) {}
                try {
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        const leave = document.exitFullscreen || document.webkitExitFullscreen;
                        if (leave) leave.call(document).catch(() => {});
                    }
                } catch (e) {}
                try { window.close(); } catch (e) {}
                setTimeout(() => {
                    if (typeof showToast === 'function') {
                        showToast('ASHU TV', 'बाहर निकलने के लिए रिमोट का Back दबाएँ या Home बटन दबाएँ');
                    }
                }, 150);
            }
        }
        document.getElementById('always-menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (optionsMenu.classList.contains('open')) closePlayerOptions();
            else openPlayerOptions();
        });
        playerOptionButtons.forEach((btn, index) => {
            btn.addEventListener('click', () => {
                playerOptionIndex = index;
                activatePlayerOption(btn.dataset.playerOption);
            });
            btn.addEventListener('focus', () => {
                playerOptionIndex = index;
                playerOptionButtons.forEach((b, i) => b.classList.toggle('tv-focus', i === index));
            });
        });
        document.addEventListener('click', (e) => {
            if (!optionsMenu.contains(e.target) && !e.target.closest('#always-menu-btn')) closePlayerOptions();
        });
        videoPlayer.addEventListener('play', updateControlIcons);
        videoPlayer.addEventListener('pause', updateControlIcons);
        // Google TV remote: Back/Escape closes the option popup before other UI.
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'Escape' || e.key === 'Backspace' || e.key === 'BrowserBack') && optionsMenu.classList.contains('open')) {
                e.preventDefault();
                e.stopPropagation();
                closePlayerOptions();
            }
        }, true);
        // --- मोबाइल टच कंट्रोल + वैकल्पिक कीबोर्ड नेविगेशन ---
        // Reliable mobile gestures: right-side vertical swipe adjusts volume; horizontal swipe changes channel.
        // Listen at document level so gestures still work in Chrome fullscreen.
        let touchStartX = 0, touchStartY = 0, touchStartVolume = 0, touchStartTime = 0;
        let activeGesture = false, gestureType = '';
        const interactiveTouchTarget = (target) => !!(target && target.closest &&
            target.closest('button, a, input, select, textarea, #player-options-menu, #quality-menu, #menu-layer, #controls-layer'));
        document.addEventListener('touchstart', (e) => {
            if (!e.touches || !e.touches[0] || interactiveTouchTarget(e.target)) {
                activeGesture = false; gestureType = ''; return;
            }
            const t = e.touches[0];
            touchStartX = t.clientX; touchStartY = t.clientY;
            touchStartVolume = Number.isFinite(videoPlayer.volume) ? videoPlayer.volume : 1;
            touchStartTime = Date.now();
            activeGesture = true; gestureType = '';
        }, {passive:true, capture:true});
        document.addEventListener('touchmove', (e) => {
            if (!activeGesture || !e.touches || !e.touches[0]) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
            if (!gestureType && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
                gestureType = Math.abs(dx) > Math.abs(dy) ? 'channel' : (touchStartX > window.innerWidth * 0.55 ? 'volume' : 'other');
            }
            if (gestureType === 'volume' && Math.abs(dy) > Math.abs(dx)) {
                if (e.cancelable) e.preventDefault();
                videoPlayer.muted = false;
                videoPlayer.volume = Math.max(0, Math.min(1, touchStartVolume - dy / Math.max(180, window.innerHeight) * 1.25));
                updateControlIcons();
                const indicator = document.getElementById('volume-indicator');
                indicator.textContent = `आवाज़ ${Math.round(videoPlayer.volume * 100)}%`;
                indicator.classList.add('show');
            } else if (gestureType === 'channel' && uiState === 'HIDDEN' && e.cancelable) {
                e.preventDefault();
            }
        }, {passive:false, capture:true});
        document.addEventListener('touchend', (e) => {
            if (!activeGesture) return;
            activeGesture = false;
            const changed = e.changedTouches && e.changedTouches[0];
            if (!changed) return;
            const dx = changed.clientX - touchStartX, dy = changed.clientY - touchStartY;
            if (gestureType === 'volume' && Math.abs(dy) > 20) {
                clearTimeout(volumeToastTimer);
                volumeToastTimer = setTimeout(() => document.getElementById('volume-indicator').classList.remove('show'), 1400);
            } else if (gestureType === 'channel' && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) && uiState === 'HIDDEN') {
                playNextChannel(dx < 0 ? 1 : -1);
            } else if (!gestureType && Math.abs(dx) < 18 && Math.abs(dy) < 18 && Date.now() - touchStartTime < 500) {
                if (uiState === 'HIDDEN') changeUIState('CONTROLS');
                else changeUIState('HIDDEN');
            }
            gestureType = '';
        }, {passive:true, capture:true});
        // स्क्रीन पर मेन्यू के बाहर टैप करने पर मेन्यू बंद करें।
        document.getElementById('menu-layer').addEventListener('click', (e) => {
            if (e.target.id === 'menu-layer') changeUIState('HIDDEN');
        });
        document.getElementById('controls-layer').addEventListener('click', (e) => {
            if (e.target.id === 'controls-layer') changeUIState('HIDDEN');
        });
        document.querySelectorAll('#controls-bar .control-btn').forEach((el, idx) => {
            el.addEventListener('click', () => { controlIndex = idx; executeControlAction(); });
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            const code = e.keyCode || e.which;
            // Google TV / Android TV remote keys: D-pad, OK, Back, media keys, channel +/-.
            const isBack = ['Escape', 'Backspace', 'BrowserBack', 'GoBack'].includes(key) || code === 4 || code === 461;
            const isMenuKey = ['ContextMenu', 'Menu', 'Guide', 'TV'].includes(key) || code === 82;
            if (isMenuKey) {
                e.preventDefault();
                if (optionsMenu.classList.contains('open')) closePlayerOptions();
                else openPlayerOptions();
                return;
            }
            if (optionsMenu.classList.contains('open')) {
                if (key === 'ArrowUp') { e.preventDefault(); playerOptionIndex = (playerOptionIndex + playerOptionButtons.length - 1) % playerOptionButtons.length; focusPlayerOption(); return; }
                if (key === 'ArrowDown') { e.preventDefault(); playerOptionIndex = (playerOptionIndex + 1) % playerOptionButtons.length; focusPlayerOption(); return; }
                if (key === 'Enter' || key === ' ') { e.preventDefault(); const b = playerOptionButtons[playerOptionIndex]; if (b) activatePlayerOption(b.dataset.playerOption); return; }
                if (isBack || key === 'ArrowLeft') { e.preventDefault(); closePlayerOptions(); return; }
            }
            if (key === 'MediaPlayPause' || key === 'PlayPause' || code === 85) {
                e.preventDefault(); if (videoPlayer.paused) videoPlayer.play().catch(() => {}); else videoPlayer.pause(); updateControlIcons(); return;
            }
            if (key === 'MediaPlay' || key === 'Play') { e.preventDefault(); videoPlayer.play().catch(() => {}); return; }
            if (key === 'MediaPause' || key === 'Pause') { e.preventDefault(); videoPlayer.pause(); return; }
            if (['ChannelUp', 'TVChannelUp', 'PageUp'].includes(key) || code === 427) { e.preventDefault(); playNextChannel(-1); return; }
            if (['ChannelDown', 'TVChannelDown', 'PageDown'].includes(key) || code === 428) { e.preventDefault(); playNextChannel(1); return; }
            const muteKeys = ['AudioVolumeMute', 'VolumeMute', 'XF86AudioMute'];
            const volumeUpKeys = ['AudioVolumeUp', 'VolumeUp', 'XF86AudioRaiseVolume'];
            const volumeDownKeys = ['AudioVolumeDown', 'VolumeDown', 'XF86AudioLowerVolume'];
            if (muteKeys.includes(key)) { e.preventDefault(); togglePlayerMute(); return; }
            if (volumeUpKeys.includes(key)) { e.preventDefault(); setPlayerVolume(0.05); return; }
            if (volumeDownKeys.includes(key)) { e.preventDefault(); setPlayerVolume(-0.05); return; }
            const validKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape', 'Backspace', 'BrowserBack', 'GoBack', 'm', 'M'];
            if (!validKeys.includes(key)) return;
            e.preventDefault();
            if (key === 'm' || key === 'M') { togglePlayerMute(); return; }

            // 1. STATE: HIDDEN (TV PLAYING FULLSCREEN)
            if (uiState === 'HIDDEN') {
                if (key === 'Enter') {
                    // Google TV remote OK opens the main player options.
                    openPlayerOptions();
                } 
                else if (key === 'ArrowUp') { playNextChannel(-1); } // Next Channel
                else if (key === 'ArrowDown') { playNextChannel(1); } // Prev Channel
                else if (key === 'ArrowLeft') { setPlayerVolume(-0.05); }
                else if (key === 'ArrowRight') { setPlayerVolume(0.05); }
                return;
            }

            // 2. STATE: CATEGORY MENU
            if (uiState === 'CATEGORY') {
                if (key === 'ArrowUp') { catIndex = Math.max(0, catIndex - 1); updateFocus(); } 
                else if (key === 'ArrowDown') { catIndex = Math.min(orderedCategoryKeys.length - 1, catIndex + 1); updateFocus(); } 
                else if (key === 'ArrowRight' || key === 'Enter') {
                    activeCategory = orderedCategoryKeys[catIndex];
                    if (groupedChannels[activeCategory] && groupedChannels[activeCategory].length > 0) {
                        chanIndex = 0;
                        if (currentChannel && currentChannel.category === activeCategory) {
                            const cIdx = groupedChannels[activeCategory].findIndex(c => c.id === currentChannel.id);
                            if (cIdx !== -1) chanIndex = cIdx;
                        }
                        renderChannels();
                        changeUIState('CHANNEL');
                    }
                } 
                else if (isBack || key === 'ArrowLeft') {
                    changeUIState('HIDDEN');
                }
                return;
            }

            // 3. STATE: CHANNEL MENU
            if (uiState === 'CHANNEL') {
                const channels = groupedChannels[activeCategory];
                if (key === 'ArrowUp') { chanIndex = Math.max(0, chanIndex - 1); updateFocus(); } 
                else if (key === 'ArrowDown') { chanIndex = Math.min(channels.length - 1, chanIndex + 1); updateFocus(); } 
                else if (key === 'ArrowLeft' || isBack) {
                    document.getElementById('chan-list').innerHTML = ''; // Clean UI
                    changeUIState('CATEGORY');
                } 
                else if (key === 'Enter') {
                    const selChannel = channels[chanIndex];
                    if (selChannel) playChannel(selChannel);
                    changeUIState('HIDDEN');
                }
                return;
            }

            // 4. STATE: PLAYER CONTROLS (BOTTOM BAR)
            if (uiState === 'CONTROLS') {
                if (key === 'ArrowLeft') {
                    controlIndex = Math.max(0, controlIndex - 1);
                    updateFocus();
                } else if (key === 'ArrowRight') {
                    controlIndex = Math.min(controlsArray.length - 1, controlIndex + 1);
                    updateFocus();
                } else if (key === 'Enter') {
                    executeControlAction();
                } else if (key === 'ArrowUp' || key === 'ArrowDown' || isBack) {
                    changeUIState('HIDDEN');
                }
                return;
            }

            // 5. STATE: QUALITY SELECTION MENU
            if (uiState === 'QUALITY') {
                if (key === 'ArrowUp') {
                    qualityIndex = Math.max(0, qualityIndex - 1);
                    updateFocus();
                } else if (key === 'ArrowDown') {
                    qualityIndex = Math.min(document.querySelectorAll('#quality-menu .qual-item').length - 1, qualityIndex + 1);
                    updateFocus();
                } else if (key === 'Enter') {
                    // Activate the highlighted resolution (only stream-supported options are enabled).
                    const selectedOption = document.querySelectorAll('#quality-menu .qual-item')[qualityIndex];
                    if (selectedOption && !selectedOption.disabled) selectedOption.click();
                } else if (key === 'ArrowLeft' || isBack) {
                    changeUIState('CONTROLS');
                }
                return;
            }
        });

        // Initialize App
        window.onload = fetchPlaylists;

    </script>
</body>
</html>
